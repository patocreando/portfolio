name: Fast mobile video transcode

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/transcode-videos-fast.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transcode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Install portable FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet --disable-pip-version-check imageio-ffmpeg
          python - <<'PY' >> "$GITHUB_ENV"
          import imageio_ffmpeg
          print("FFMPEG_BIN=" + imageio_ffmpeg.get_ffmpeg_exe())
          PY

      - name: Transcode videos for older Android
        shell: bash
        run: |
          set -euo pipefail

          echo "Using FFmpeg: $FFMPEG_BIN"
          "$FFMPEG_BIN" -version

          mkdir -p /tmp/mobile-videos

          for file in assets/videos/*.mp4; do
            [ -e "$file" ] || continue

            name="$(basename "$file")"
            out="/tmp/mobile-videos/$name"

            echo "=== Transcoding $name ==="

            "$FFMPEG_BIN" -y \
              -i "$file" \
              -map 0:v:0 \
              -vf "scale='min(720,iw)':-2:force_original_aspect_ratio=decrease,fps=30,format=yuv420p" \
              -c:v libx264 \
              -profile:v baseline \
              -level:v 3.0 \
              -preset medium \
              -crf 24 \
              -maxrate 2500k \
              -bufsize 5000k \
              -g 60 \
              -keyint_min 30 \
              -sc_threshold 0 \
              -movflags +faststart \
              -an \
              "$out"

            mv "$out" "$file"
          done

      - name: Commit compatible videos
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- assets/videos; then
            echo "No video changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/videos/*.mp4
          git commit -m "Encode videos for older Android devices"
          git push
