name: Portfolio smoke QA
on:
  push:
    branches:
      - improve/portfolio-cold-traffic
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify JavaScript syntax
        run: node --check assets/site.js
      - name: Verify portfolio invariants
        run: node scripts/smoke-portfolio.mjs
